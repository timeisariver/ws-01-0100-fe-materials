<!doctype html>
<html>
  <head>
    <title>Todo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="stylesheets/style.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <script
      src="https://kit.fontawesome.com/51423ebba7.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="body">
    <header class="header">
      <h1 class="header__text">Todo</h1>
    </header>
    <main class="main">
      <form class="form js-form">
        <label>
          <p>タスク</p>
          <input id="js-task-name" type="text" />
        </label>
        <label>
          <p>期限日</p>
          <input id="js-task-deadline" type="date" />
        </label>
        <button>追加</button>
      </form>
      <div class="content">
        <label class="content__completed">
          <input type="checkbox" class="js-show-completed" />
          <p>完了タスクを表示</p>
        </label>
        <div class="content__head">
          <div class="content__head-item">完了</div>
          <div class="content__head-item content__head-item--name">タスク</div>
          <div class="content__head-item">期限日</div>
          <div class="content__head-item">削除</div>
        </div>
        <div class="content__list js-list-container"></div>
      </div>
    </main>
    <script src="js/lib.js"></script>
    <script src="js/function.js"></script>
  </body>
</html>
